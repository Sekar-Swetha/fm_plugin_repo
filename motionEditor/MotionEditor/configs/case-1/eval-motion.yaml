pretrained_model_path: checkpoints/stable-diffusion-v1-5
output_dir: "outputs/eval-case-1-motion"
resume_from_checkpoint: "outputs/train-case-1-motion/checkpoint-1500-fm"
adapter_weight_path: "outputs/train-case-1-motion/controlnet_adapter_checkpoint-1500-fm.pth"

input_data:
  video_dir: "data/case-1"
  prompt: "a girl is dancing"
  n_sample_frames: 8
  width: 512
  height: 512
  sample_start_idx: 0
  sample_frame_rate: 1
  condition: [openposefull]
  video_suffix: .png
  condition_suffix: .png
  noise_level: 10000
  image_embed_drop: 0.1
  source_mask_dir: man.mask

validation_data:
  prompts:
    - "a girl is dancing"

  video_length: 8
  width: 512
  height: 512
  noise_level: 0
  num_inference_steps: 50
  guidance_scale: 7.5
  num_inv_steps: 50
  use_null_inv: False
  null_inner_steps: 1
  null_base_lr: 1e-2
  null_uncond_ratio: -0.5
  null_normal_infer: True
  controlnet_conditioning_scale: 1.0

  # ---- Contribution C2: distilled direct flow editor ----
  use_flow_inversion: True
  loss_type: cfm_ot
  flow_from_source: True        # start ODE at source latent (no inversion)
  flow_no_injection: True       # match training (distill had no two-branch attn)
  flow_inv_steps: 1             # 1 step = reproduce teacher. sweep 1,2,4
  flow_inv_method: euler        # euler for 1 step (heun needs >=2)

input_batch_size: 1
seed: 33
mixed_precision: "no"
gradient_checkpointing: True
enable_xformers_memory_efficient_attention: True
use_sc_attn: True
use_st_attn: False
st_attn_idx: 0
